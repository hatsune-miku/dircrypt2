name: Native tests and release candidate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  build:
    name: Test and build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: dircrypt.exe
          - os: macos-14
            target: aarch64-apple-darwin
            binary: dircrypt
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            binary: dircrypt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Rust toolchain and target
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.94.1 '${{ matrix.target }}'
      - name: Install musl C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Allow Windows symlink tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-1.94.1-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --target '${{ matrix.target }}' --locked -- -D warnings
      - name: Native crash recovery and filesystem tests
        run: cargo test --target '${{ matrix.target }}' --locked -- --test-threads=1
      - name: Build release executable
        run: cargo build --release --target '${{ matrix.target }}' --locked
      - name: Verify release binary and prepare portable archives
        run: python tools/ci_portability.py create 'target/${{ matrix.target }}/release/${{ matrix.binary }}' portable-archives '${{ matrix.target }}'
      - name: Package executable
        run: python tools/package_release.py --target '${{ matrix.target }}' --binary 'target/${{ matrix.target }}/release/${{ matrix.binary }}' --output release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: release-assets/*
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-${{ matrix.target }}
          path: portable-archives/*.tar
          overwrite: true
          if-no-files-found: error
          retention-days: 3

  portability:
    name: Restore all platform archives on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ matrix.target }}
          path: packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: portable-*
          path: portable-archives
      - run: python tools/ci_portability.py check packages portable-archives

  release:
    name: Publish complete release candidate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, portability]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets
      - name: Upload assets and publish
        run: python tools/publish_rc.py
        env:
          GH_TOKEN: ${{ github.token }}
