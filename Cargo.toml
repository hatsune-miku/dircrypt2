[package]
name = "dircrypt"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
description = "Recoverable filename and optional header obfuscation for Windows, macOS and Linux"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
getrandom = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.25"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
